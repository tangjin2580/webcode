<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>429 · Too Many Requests</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background:
              radial-gradient(ellipse at 50% 50%, #2a1f10 0%, #1a1308 60%, #0a0804 100%);
      background-color: #1a1308;
      color: #f3ede0;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1.5rem;
      padding: 2rem;
    }

    /* 顶部状态栏 */
    .status-bar {
      position: absolute;
      top: 24px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: rgba(243, 237, 224, 0.45);
      letter-spacing: 0.15em;
      z-index: 10;
    }
    .status-bar .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #cc7d2d;
      box-shadow: 0 0 8px #cc7d2d;
      margin-right: 8px;
      animation: pulse 0.6s ease-in-out infinite;
    }
    .status-bar .code {
      font-family: 'JetBrains Mono', monospace;
      color: rgba(243, 237, 224, 0.6);
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    /* 中央卡皮巴拉容器 */
    .capy-wrap {
      position: relative;
      width: 380px;
      max-width: 90vw;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* 背景巨型 429 */
    .big-code {
      position: absolute;
      font-size: 240px;
      font-weight: 800;
      color: rgba(204, 125, 45, 0.06);
      letter-spacing: -0.05em;
      user-select: none;
      z-index: 0;
      font-family: 'Inter', sans-serif;
    }

    /* 用户提供的 capybaraloader 原样 */
    .capybaraloader {
      width: 14em;
      height: 10em;
      position: relative;
      z-index: 3;
      --color: rgb(204, 125, 45);
      --color2: rgb(83, 56, 28);
      transform: scale(1.1);
    }
    .capybara {
      width: 100%;
      height: 7.5em;
      position: relative;
      z-index: 1;
    }
    .loader {
      width: 100%;
      height: 2.5em;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }
    .capy {
      width: 85%;
      height: 100%;
      background: linear-gradient(var(--color), 90%, var(--color2));
      border-radius: 45%;
      position: relative;
      z-index: 1;
      animation: movebody 1s linear infinite;
    }
    .capyhead {
      width: 7.5em;
      height: 7em;
      bottom: 0em;
      right: 0em;
      position: absolute;
      background-color: var(--color);
      z-index: 3;
      border-radius: 3.5em;
      box-shadow: -1em 0em var(--color2);
      animation: movebody 1s linear infinite;
    }
    .capyear {
      width: 2em;
      height: 2em;
      background: linear-gradient(-45deg, var(--color), 90%, var(--color2));
      top: 0em;
      left: 0em;
      border-radius: 100%;
      position: absolute;
      overflow: hidden;
      z-index: 3;
    }
    .capyear:nth-child(2) {
      left: 5em;
      background: linear-gradient(25deg, var(--color), 90%, var(--color2));
    }
    .capyear2 {
      width: 100%;
      height: 1em;
      background-color: var(--color2);
      bottom: 0em;
      left: 0.5em;
      border-radius: 100%;
      position: absolute;
      transform: rotate(-45deg);
    }
    .capymouth {
      width: 3.5em;
      height: 2em;
      background-color: var(--color2);
      position: absolute;
      bottom: 0em;
      left: 2.5em;
      border-radius: 50%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0.5em;
    }
    .capylips {
      width: 0.25em;
      height: 0.75em;
      border-radius: 100%;
      transform: rotate(-45deg);
      background-color: var(--color);
    }
    .capylips:nth-child(2) {
      transform: rotate(45deg);
    }
    .capyeye {
      width: 2em;
      height: 0.5em;
      background-color: var(--color2);
      position: absolute;
      bottom: 3.5em;
      left: 1.5em;
      border-radius: 5em;
      transform: rotate(45deg);
    }
    .capyeye:nth-child(4) {
      transform: rotate(-45deg);
      left: 5.5em;
      width: 1.75em;
    }
    .capyleg {
      width: 6em;
      height: 5em;
      bottom: 0em;
      left: 0em;
      position: absolute;
      background: linear-gradient(var(--color), 95%, var(--color2));
      z-index: 2;
      border-radius: 2em;
      animation: movebody 1s linear infinite;
    }
    .capyleg2 {
      width: 1.75em;
      height: 3em;
      bottom: 0em;
      left: 3.25em;
      position: absolute;
      background: linear-gradient(var(--color), 80%, var(--color2));
      z-index: 2;
      border-radius: 0.75em;
      box-shadow: inset 0em -0.5em var(--color2);
      animation: moveleg 1s linear infinite;
    }
    .capyleg2:nth-child(3) {
      width: 1.25em;
      left: 0.5em;
      height: 2em;
      animation: moveleg2 1s linear infinite 0.075s;
    }
    @keyframes moveleg {
      0%   { transform: rotate(-45deg) translateX(-5%); }
      50%  { transform: rotate(45deg) translateX(5%); }
      100% { transform: rotate(-45deg) translateX(-5%); }
    }
    @keyframes moveleg2 {
      0%   { transform: rotate(45deg); }
      50%  { transform: rotate(-45deg); }
      100% { transform: rotate(45deg); }
    }
    @keyframes movebody {
      0%   { transform: translateX(0%); }
      50%  { transform: translateX(2%); }
      100% { transform: translateX(0%); }
    }
    .loaderline {
      width: 50em;
      height: 0.5em;
      border-top: 0.5em dashed var(--color2);
      animation: moveline 10s linear infinite;
    }
    @keyframes moveline {
      0%   { transform: translateX(0%); opacity: 0%; }
      5%   { opacity: 100%; }
      95%  { opacity: 100%; }
      100% { opacity: 0%; transform: translateX(-70%); }
    }

    /* 文案区 */
    .message {
      text-align: center;
      z-index: 5;
      max-width: 520px;
    }
    .message h1 {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: 0.01em;
    }
    .message h1 .accent {
      color: #cc7d2d;
    }
    .message p {
      font-size: 14px;
      color: rgba(243, 237, 224, 0.55);
      line-height: 1.6;
    }
    .message .mono {
      font-family: 'JetBrains Mono', monospace;
      color: rgba(243, 237, 224, 0.4);
      font-size: 12px;
      margin-top: 10px;
    }

    /* 频率限制信息卡 */
    .rate-card {
      width: 360px;
      max-width: 90vw;
      background: rgba(204, 125, 45, 0.05);
      border: 1px solid rgba(204, 125, 45, 0.2);
      border-radius: 6px;
      padding: 16px 20px;
      z-index: 5;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: rgba(243, 237, 224, 0.75);
    }
    .rate-card .row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px dashed rgba(204, 125, 45, 0.1);
    }
    .rate-card .row:last-child {
      border-bottom: none;
    }
    .rate-card .key {
      color: rgba(243, 237, 224, 0.5);
      letter-spacing: 0.1em;
    }
    .rate-card .val {
      color: #cc7d2d;
    }
    .rate-card .bar {
      width: 100%;
      height: 3px;
      background: rgba(204, 125, 45, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 8px;
    }
    .rate-card .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #cc7d2d, #e6963ff);
      border-radius: 2px;
      width: 85%;
      box-shadow: 0 0 6px rgba(204, 125, 45, 0.5);
    }

    /* 底部 */
    .footer {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(243, 237, 224, 0.35);
      letter-spacing: 0.2em;
      text-align: center;
      z-index: 5;
    }
    .footer .id {
      font-family: 'JetBrains Mono', monospace;
      color: rgba(243, 237, 224, 0.5);
      margin-bottom: 4px;
    }

    @media (max-width: 480px) {
      .big-code { font-size: 160px; }
      .capy-wrap { width: 320px; height: 240px; }
      .capybaraloader { transform: scale(0.85); }
      .message h1 { font-size: 20px; }
      .rate-card { font-size: 10px; padding: 12px 14px; }
    }
  </style>
</head>
<body>
<div class="status-bar">
  <div><span class="dot"></span>RATE LIMIT EXCEEDED</div>
  <div class="code">429 TOO MANY REQUESTS</div>
</div>

<div class="capy-wrap">
  <div class="big-code">429</div>

  <div class="capybaraloader">
    <div class="capybara">
      <div class="capyhead">
        <div class="capyear">
          <div class="capyear2"></div>
        </div>
        <div class="capyear"></div>
        <div class="capymouth">
          <div class="capylips"></div>
          <div class="capylips"></div>
        </div>
        <div class="capyeye"></div>
        <div class="capyeye"></div>
      </div>
      <div class="capyleg"></div>
      <div class="capyleg2"></div>
      <div class="capyleg2"></div>
      <div class="capy"></div>
    </div>
    <div class="loader">
      <div class="loaderline"></div>
    </div>
  </div>
</div>

<div class="message">
  <h1>请求<span class="accent">过于频繁</span> · 请稍后再试</h1>
  <p>您发送的请求超过了速率限制，卡皮巴拉正在慢慢走，请给它一点时间。</p>
  <div class="mono">[nginx/1.24.0 · 429 · ERR_RATE_LIMITED · 100 req/min]</div>
</div>

<div class="rate-card">
  <div class="row"><span class="key">LIMIT</span><span class="val">100 / min</span></div>
  <div class="row"><span class="key">USED</span><span class="val">85 / 100</span></div>
  <div class="row"><span class="key">RESET</span><span class="val">12.4s</span></div>
  <div class="bar"><div class="bar-fill"></div></div>
</div>

<div class="footer">
  <div class="id">REQ_ID · 429-R3C8-5L2D-K9W7</div>
  <div>SLOW DOWN · THE CAPYBARA NEEDS A BREAK</div>
</div>
</body>
</html>
