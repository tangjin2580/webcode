<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>465 · Waiting Room</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background:
              radial-gradient(ellipse at 50% 60%, #2a1f15 0%, #150d08 60%, #000000 100%);
      background-color: #150d08;
      color: #f3ede0;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1.2rem;
      padding: 2rem;
    }

    /* 顶部状态栏 */
    .status-bar {
      position: absolute;
      top: 24px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: rgba(243, 237, 224, 0.45);
      letter-spacing: 0.15em;
      z-index: 10;
    }
    .status-bar .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff8147;
      box-shadow: 0 0 8px #ff8147;
      margin-right: 8px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    .status-bar .code {
      font-family: 'JetBrains Mono', monospace;
      color: rgba(243, 237, 224, 0.6);
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* 中央容器 - 柴犬 */
    .main {
      position: relative;
      width: 24vmax;
      height: 24vmax;
      max-width: 360px;
      max-height: 360px;
      min-width: 200px;
      min-height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 3;
      margin-top: 60px;
    }

    /* 背景巨型 465 */
    .big-code {
      position: absolute;
      font-size: 240px;
      font-weight: 800;
      color: rgba(255, 129, 71, 0.06);
      letter-spacing: -0.05em;
      user-select: none;
      z-index: 0;
      font-family: 'Inter', sans-serif;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* 用户提供的柴犬 CSS 原样搬过来 */
    .dog {
      position: relative;
      width: 22.5vmax;
      height: 8.25vmax;
    }

    .dog::before {
      content: "";
      position: absolute;
      bottom: -0.75vmax;
      right: -0.15vmax;
      width: 100%;
      height: 1.5vmax;
      background-color: rgba(28, 49, 48, 0.1);
      border-radius: 50%;
      z-index: -1000;
      animation: shadow 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
    }

    .dog__head {
      position: absolute;
      left: 4.5vmax;
      bottom: 0;
      width: 9.75vmax;
      height: 8.25vmax;
      border-top-left-radius: 4.05vmax;
      border-top-right-radius: 4.05vmax;
      border-bottom-right-radius: 3.3vmax;
      border-bottom-left-radius: 3.3vmax;
      background-color: #ff8147;
      animation: head 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
    }

    .dog__head-c {
      position: absolute;
      left: 1.5vmax;
      bottom: 0;
      width: 9.75vmax;
      height: 8.25vmax;
      animation: head 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
      z-index: -1;
    }

    .dog__snout {
      position: absolute;
      left: -1.5vmax;
      bottom: 0;
      width: 7.5vmax;
      height: 3.75vmax;
      border-top-right-radius: 3vmax;
      border-bottom-right-radius: 3vmax;
      border-bottom-left-radius: 4.5vmax;
      background-color: #d7dbd2;
      animation: snout 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
    }

    .dog__snout::before {
      content: "";
      position: absolute;
      left: -0.1125vmax;
      top: -0.15vmax;
      width: 1.875vmax;
      height: 1.125vmax;
      border-top-right-radius: 3vmax;
      border-bottom-right-radius: 3vmax;
      border-bottom-left-radius: 4.5vmax;
      background-color: #1c3130;
      animation: snout-b 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
    }

    .dog__nose {
      position: absolute;
      top: -1.95vmax;
      left: 40%;
      width: 0.75vmax;
      height: 2.4vmax;
      border-radius: 0.525vmax;
      transform-origin: bottom;
      transform: rotateZ(10deg);
      background-color: #d7dbd2;
    }

    .dog__eye-l,
    .dog__eye-r {
      position: absolute;
      top: -0.9vmax;
      width: 0.675vmax;
      height: 0.375vmax;
      border-radius: 50%;
      background-color: #1c3130;
      animation: eye 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
    }

    .dog__eye-l { left: 27%; }
    .dog__eye-r { left: 65%; }

    .dog__ear-l,
    .dog__ear-r {
      position: absolute;
      width: 10.5vmax;
      height: 3.375vmax;
      border-top-left-radius: 0vmax;
      border-top-right-radius: 0vmax;
      border-bottom-right-radius: 3.3vmax;
      border-bottom-left-radius: 3.3vmax;
      background-color: #e26538;
    }

    .dog__ear-l {
      top: 1.5vmax;
      left: 6vmax;
      transform-origin: bottom left;
      transform: rotateZ(-50deg);
      z-index: -1;
      animation: ear-l 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
    }

    .dog__ear-r {
      top: 1.5vmax;
      right: 3vmax;
      transform-origin: bottom right;
      transform: rotateZ(20deg);
      z-index: -2;
      animation: ear-r 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
    }

    .dog__body {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      position: absolute;
      bottom: 0.3vmax;
      left: 3.75vmax;
      width: 18.75vmax;
      height: 7.2vmax;
      border-top-left-radius: 3vmax;
      border-top-right-radius: 6vmax;
      border-bottom-right-radius: 1.5vmax;
      border-bottom-left-radius: 6vmax;
      background-color: #ff702e;
      z-index: -2;
      animation: body 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
    }

    .dog__tail {
      position: absolute;
      right: -3vmax;
      height: 1.5vmax;
      width: 4.5vmax;
      background-color: #e96839;
      border-radius: 1.5vmax;
    }

    .dog__paws {
      position: absolute;
      bottom: 0;
      left: 7.5vmax;
      width: 12vmax;
      height: 3vmax;
    }

    .leg {
      position: absolute;
      bottom: 0;
      width: 2vmax;
      height: 2.125vmax;
    }

    .paw {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1.95vmax;
      height: 1.875vmax;
      overflow: hidden;
    }

    .paw::before {
      content: "";
      position: absolute;
      width: 3.75vmax;
      height: 3.75vmax;
      border-radius: 50%;
    }

    .top {
      position: absolute;
      bottom: 0;
      left: 0.75vmax;
      height: 4.5vmax;
      width: 2.625vmax;
      border-top-left-radius: 1.425vmax;
      border-top-right-radius: 1.425vmax;
      transform-origin: bottom right;
      transform: rotateZ(90deg) translateX(-0.1vmax) translateY(1.5vmax);
      z-index: -1;
      background-image: linear-gradient(70deg, transparent 20%, #ff8b56 20%);
    }

    .dog__bl-leg {
      left: -3vmax;
      z-index: -10;
    }
    .dog__bl-paw::before { background-color: #bec4b6; }
    .dog__bl-top { background-image: linear-gradient(80deg, transparent 20%, #e96839 20%); }

    .dog__fl-leg { z-index: 10; left: 0; }
    .dog__fl-paw::before { background-color: #d7dbd2; }

    .dog__fr-leg { right: 0; }
    .dog__fr-paw::before { background-color: #d7dbd2; }

    @keyframes head {
      0%, 10%, 20%, 26%, 28%, 90%, 100% {
        height: 8.25vmax; bottom: 0;
        transform-origin: bottom right; transform: rotateZ(0);
      }
      5%, 15%, 22%, 24%, 30% { height: 8.1vmax; }
      32%, 50% { height: 8.25vmax; }
      55%, 60% {
        bottom: 0.75vmax;
        transform-origin: bottom right; transform: rotateZ(0);
      }
      70%, 80% {
        bottom: 0.75vmax;
        transform-origin: bottom right; transform: rotateZ(10deg);
      }
    }
    @keyframes body {
      0%, 10%, 20%, 26%, 28%, 32%, 100% { height: 7.2vmax; }
      5%, 15%, 22%, 24%, 30% { height: 7.05vmax; }
    }
    @keyframes ear-l {
      0%, 10%, 20%, 26%, 28%, 82%, 100% { transform: rotateZ(-50deg); }
      5%, 15%, 22%, 24% { transform: rotateZ(-48deg); }
      30%, 31% { transform: rotateZ(-30deg); }
      32%, 80% { transform: rotateZ(-60deg); }
    }
    @keyframes ear-r {
      0%, 10%, 20%, 26%, 28% { transform: rotateZ(20deg); }
      5%, 15%, 22%, 24% { transform: rotateZ(18deg); }
      30%, 31% { transform: rotateZ(10deg); }
      32% { transform: rotateZ(25deg); }
    }
    @keyframes snout {
      0%, 10%, 20%, 26%, 28%, 82%, 100% { height: 3.75vmax; }
      5%, 15%, 22%, 24% { height: 3.45vmax; }
    }
    @keyframes snout-b {
      0%, 10%, 20%, 26%, 28%, 98%, 100% { width: 1.875vmax; }
      5%, 15%, 22%, 24% { width: 1.8vmax; }
      34%, 98% { width: 1.275vmax; }
    }
    @keyframes shadow {
      0%, 10%, 20%, 26%, 28%, 30%, 84%, 100% { width: 99%; }
      5%, 15%, 22%, 24% { width: 101%; }
      34%, 81% { width: 96%; }
    }
    @keyframes eye {
      0%, 30% { width: 0.675vmax; height: 0.3vmax; }
      32%, 59%, 90%, 100% {
        width: 0.525vmax; height: 0.525vmax;
        transform: translateY(0);
      }
      60%, 75% { transform: translateY(-0.3vmax); }
      80%, 85% { transform: translateY(0.15vmax); }
    }

    /* 文案区 */
    .message {
      text-align: center;
      z-index: 5;
      max-width: 520px;
    }
    .message h1 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 10px;
      letter-spacing: 0.01em;
    }
    .message h1 .accent {
      color: #ff8147;
    }
    .message p {
      font-size: 14px;
      color: rgba(243, 237, 224, 0.55);
      line-height: 1.6;
    }
    .message .mono {
      font-family: 'JetBrains Mono', monospace;
      color: rgba(243, 237, 224, 0.4);
      font-size: 12px;
      margin-top: 8px;
    }

    /* 队列信息卡 */
    .queue-card {
      width: 360px;
      max-width: 90vw;
      background: rgba(255, 129, 71, 0.05);
      border: 1px solid rgba(255, 129, 71, 0.18);
      border-radius: 6px;
      padding: 14px 20px;
      z-index: 5;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: rgba(243, 237, 224, 0.75);
    }
    .queue-card .row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px dashed rgba(255, 129, 71, 0.1);
    }
    .queue-card .row:last-of-type {
      border-bottom: none;
    }
    .queue-card .key {
      color: rgba(243, 237, 224, 0.5);
      letter-spacing: 0.1em;
    }
    .queue-card .val {
      color: #ff8147;
    }

    /* 进度条 - 队列前面还有多少人 */
    .queue-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 129, 71, 0.08);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 10px;
    }
    .queue-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff8147, #ffb088);
      border-radius: 2px;
      width: 35%;
      box-shadow: 0 0 8px rgba(255, 129, 71, 0.5);
      animation: queueMove 8s ease-in-out infinite;
    }
    @keyframes queueMove {
      0%   { width: 35%; }
      50%  { width: 62%; }
      100% { width: 35%; }
    }

    /* 底部 */
    .footer {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(243, 237, 224, 0.35);
      letter-spacing: 0.2em;
      text-align: center;
      z-index: 5;
    }
    .footer .id {
      font-family: 'JetBrains Mono', monospace;
      color: rgba(243, 237, 224, 0.5);
      margin-bottom: 4px;
    }

    @media (max-width: 480px) {
      .big-code { font-size: 150px; }
      .main { width: 180px; height: 180px; }
      .message h1 { font-size: 18px; }
      .queue-card { font-size: 10px; padding: 12px 14px; }
    }
  </style>
</head>
<body>
<div class="status-bar">
  <div><span class="dot"></span>QUEUE · WAITING</div>
  <div class="code">465 PLEASE WAIT</div>
</div>

<div class="big-code">465</div>

<div class="main">
  <div class="dog">
    <div class="dog__paws">
      <div class="dog__bl-leg leg">
        <div class="dog__bl-paw paw"></div>
        <div class="dog__bl-top top"></div>
      </div>
      <div class="dog__fl-leg leg">
        <div class="dog__fl-paw paw"></div>
        <div class="dog__fl-top top"></div>
      </div>
      <div class="dog__fr-leg leg">
        <div class="dog__fr-paw paw"></div>
        <div class="dog__fr-top top"></div>
      </div>
    </div>

    <div class="dog__body">
      <div class="dog__tail"></div>
    </div>

    <div class="dog__head">
      <div class="dog__snout">
        <div class="dog__nose"></div>
        <div class="dog__eyes">
          <div class="dog__eye-l"></div>
          <div class="dog__eye-r"></div>
        </div>
      </div>
    </div>

    <div class="dog__head-c">
      <div class="dog__ear-l"></div>
      <div class="dog__ear-r"></div>
    </div>
  </div>
</div>

<div class="message">
  <h1>正在<span class="accent">排队等待</span> · 请稍候片刻</h1>
  <p>前方有多位用户正在处理中，您已进入虚拟等候室。轮到您时会自动放行。</p>
  <div class="mono">[queue/2.4.1 · 465 · WAITING_ROOM · position=847]</div>
</div>

<div class="queue-card">
  <div class="row"><span class="key">POSITION</span><span class="val">847 / 2143</span></div>
  <div class="row"><span class="key">EST_WAIT</span><span class="val">~3 min</span></div>
  <div class="row"><span class="key">RATE</span><span class="val">2.4 / sec</span></div>
  <div class="queue-bar"><div class="queue-bar-fill"></div></div>
</div>

<div class="footer">
  <div class="id">REQ_ID · 465-D4R7-9T2M-N6X1</div>
  <div>GOOD THINGS TAKE TIME · PLEASE BE PATIENT</div>
</div>
</body>
</html>
