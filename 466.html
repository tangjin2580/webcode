<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>466 · 应用维护中</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background:
              radial-gradient(ellipse at 50% 70%, #1a2530 0%, #0d1419 60%, #000000 100%);
      background-color: #0d1419;
      color: #e6edf3;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1.5rem;
      padding: 2rem;
    }

    /* 顶部状态栏 */
    .status-bar {
      position: absolute;
      top: 24px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: rgba(230, 237, 243, 0.45);
      letter-spacing: 0.15em;
      z-index: 10;
    }
    .status-bar .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffc107;
      box-shadow: 0 0 8px #ffc107;
      margin-right: 8px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .status-bar .code {
      font-family: 'JetBrains Mono', monospace;
      color: rgba(230, 237, 243, 0.6);
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* 中央维护容器 */
    .maintain-wrap {
      position: relative;
      width: 480px;
      max-width: 90vw;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* 背景巨型 466 */
    .big-code {
      position: absolute;
      font-size: 240px;
      font-weight: 800;
      color: rgba(255, 193, 7, 0.05);
      letter-spacing: -0.05em;
      user-select: none;
      z-index: 0;
      font-family: 'Inter', sans-serif;
    }

    /* 路面虚线 */
    .ground {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }
    .ground::before {
      content: "";
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      height: 2px;
      background: repeating-linear-gradient(
              90deg,
              rgba(255, 193, 7, 0.4) 0px,
              rgba(255, 193, 7, 0.4) 20px,
              transparent 20px,
              transparent 40px
      );
      animation: groundMove 0.8s linear infinite;
    }
    @keyframes groundMove {
      to { background-position: -40px 0; }
    }

    /* 用户提供的 loader 原样 */
    .loader {
      width: fit-content;
      height: fit-content;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 3;
    }
    .truckWrapper {
      width: 200px;
      height: 100px;
      display: flex;
      flex-direction: column;
      position: relative;
      align-items: center;
      justify-content: flex-end;
      overflow: visible;
    }
    .truckBody {
      width: 130px;
      height: fit-content;
      margin-bottom: 6px;
      animation: motion 1s linear infinite;
    }
    @keyframes motion {
      0% { transform: translateY(0px); }
      50% { transform: translateY(3px); }
      100% { transform: translateY(0px); }
    }
    .truckTires {
      width: 130px;
      height: fit-content;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0px 10px 0px 15px;
      position: absolute;
      bottom: 0;
    }
    .truckTires svg {
      width: 24px;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .road {
      width: 100%;
      height: 1.5px;
      background-color: #282828;
      position: relative;
      bottom: 0;
      align-self: flex-end;
      border-radius: 3px;
    }
    .road::before {
      content: "";
      position: absolute;
      width: 20px;
      height: 100%;
      background-color: #282828;
      right: -50%;
      border-radius: 3px;
      animation: roadAnimation 1.4s linear infinite;
      border-left: 10px solid white;
    }
    .road::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 100%;
      background-color: #282828;
      right: -65%;
      border-radius: 3px;
      animation: roadAnimation 1.4s linear infinite;
      border-left: 4px solid white;
    }
    .lampPost {
      position: absolute;
      bottom: 0;
      right: -90%;
      height: 90px;
      animation: roadAnimation 1.4s linear infinite;
    }
    @keyframes roadAnimation {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-350px); }
    }

    /* 围栏警告线 */
    .caution {
      position: absolute;
      top: 20%;
      left: 0;
      right: 0;
      height: 14px;
      background: repeating-linear-gradient(
              45deg,
              #ffc107 0px,
              #ffc107 14px,
              #1a1a1a 14px,
              #1a1a1a 28px
      );
      opacity: 0.85;
      z-index: 2;
      box-shadow: 0 0 12px rgba(255, 193, 7, 0.3);
    }

    /* 工具箱小图标 */
    .toolbox {
      position: absolute;
      top: 20%;
      right: 10%;
      width: 36px;
      height: 36px;
      z-index: 3;
      opacity: 0.7;
      animation: toolBob 2s ease-in-out infinite;
    }
    @keyframes toolBob {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-6px) rotate(5deg); }
    }

    /* 文案区 */
    .message {
      text-align: center;
      z-index: 5;
      max-width: 520px;
    }
    .message h1 {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: 0.01em;
    }
    .message h1 .accent {
      color: #ffc107;
    }
    .message p {
      font-size: 14px;
      color: rgba(230, 237, 243, 0.55);
      line-height: 1.6;
    }
    .message .mono {
      font-family: 'JetBrains Mono', monospace;
      color: rgba(230, 237, 243, 0.4);
      font-size: 12px;
      margin-top: 10px;
    }

    /* 倒计时 */
    .eta {
      display: flex;
      gap: 12px;
      justify-content: center;
      z-index: 5;
      font-family: 'JetBrains Mono', monospace;
    }
    .eta-block {
      background: rgba(255, 193, 7, 0.08);
      border: 1px solid rgba(255, 193, 7, 0.2);
      padding: 8px 14px;
      border-radius: 4px;
      min-width: 56px;
      text-align: center;
    }
    .eta-block .num {
      font-size: 22px;
      font-weight: 700;
      color: #ffc107;
      display: block;
    }
    .eta-block .lbl {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: rgba(230, 237, 243, 0.4);
    }

    /* 底部 */
    .footer {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(230, 237, 243, 0.35);
      letter-spacing: 0.2em;
      text-align: center;
      z-index: 5;
    }
    .footer .id {
      font-family: 'JetBrains Mono', monospace;
      color: rgba(230, 237, 243, 0.5);
      margin-bottom: 4px;
    }

    @media (max-width: 480px) {
      .big-code { font-size: 160px; }
      .maintain-wrap { width: 320px; height: 220px; }
      .message h1 { font-size: 20px; }
      .eta-block { min-width: 48px; padding: 6px 10px; }
      .eta-block .num { font-size: 18px; }
    }
  </style>
</head>

<script>
  // 简单倒计时（2小时47分33秒起算，每秒减1）
  let total = 2 * 3600 + 47 * 60 + 33;
  const hh = document.getElementById('hh');
  const mm = document.getElementById('mm');
  const ss = document.getElementById('ss');
  function tick() {
    if (total <= 0) return;
    total--;
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    hh.textContent = String(h).padStart(2, '0');
    mm.textContent = String(m).padStart(2, '0');
    ss.textContent = String(s).padStart(2, '0');
  }
  setInterval(tick, 1000);
</script>
