<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>468 · 人机验证</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background:
              radial-gradient(ellipse at 50% 30%, #1a1d29 0%, #0d0f17 60%, #000000 100%);
      background-color: #0d0f17;
      color: #e6e8ef;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 2rem;
      padding: 2rem;
    }

    /* 顶部状态条 */
    .status-bar {
      position: absolute;
      top: 24px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: rgba(230, 232, 239, 0.45);
      letter-spacing: 0.15em;
      z-index: 10;
    }
    .status-bar .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffb3c1;
      box-shadow: 0 0 8px #ffb3c1;
      margin-right: 8px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .status-bar .code {
      font-family: 'Courier New', monospace;
      color: rgba(230, 232, 239, 0.6);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* 中央容器 */
    .verify-container {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 巨大的背景 468 */
    .big-code {
      position: absolute;
      font-size: 220px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.04);
      letter-spacing: -0.05em;
      user-select: none;
      z-index: 0;
      font-family: 'Inter', sans-serif;
    }

    /* 旋转光环 */
    .ring {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.06);
      z-index: 1;
    }
    .ring::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 50%;
      border: 1px solid transparent;
      border-top-color: rgba(255, 135, 135, 0.6);
      border-right-color: rgba(173, 73, 230, 0.4);
      animation: spin 3s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 用户提供的 bubble 容器 */
    .Strich1 {
      position: absolute;
      width: 130px;
      height: 50px;
      background: #000;
      border-radius: 25px;
      transform: rotate(45deg);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      z-index: 2;
    }
    .Strich2 {
      position: absolute;
      width: 130px;
      height: 50px;
      background: #000;
      border-radius: 25px;
      transform: rotate(-90deg);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      z-index: 2;
    }

    .bubble {
      position: absolute;
      top: 0;
      left: 15px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffb3c1, #e64980, #ff8787);
      animation: dropAndShift 5s ease-in-out infinite;
      z-index: 3;
    }
    .bubble1 {
      position: absolute;
      top: 0;
      width: 20px;
      height: 20px;
      background: radial-gradient(circle at 30% 30%, #edb3ff, #ac49e6, #fb87ff);
      border-radius: 50%;
      left: 8px;
      animation: dropAndShift 6s ease-in-out infinite;
      z-index: 4;
    }
    .bubble2 {
      position: absolute;
      top: 0;
      width: 20px;
      height: 20px;
      background: radial-gradient(circle at 30% 30%, #b3d8ff, #4963e6, #87a7ff);
      border-radius: 50%;
      left: 12px;
      animation: dropAndShift 4s ease-in-out infinite;
      z-index: 5;
    }
    .bubble3 {
      position: absolute;
      top: 0;
      width: 20px;
      height: 20px;
      background: radial-gradient(circle at 30% 30%, #b3ffbc, #35a32f, #75ba61);
      border-radius: 50%;
      left: 10px;
      animation: dropAndShift 7s ease-in-out infinite;
      z-index: 6;
    }

    @keyframes dropAndShift {
      0%   { transform: translate(0px, 15px); }
      16.67% { transform: translate(80px, 13px); }
      33.34% { transform: translate(40px, 10px); }
      50.01% { transform: translate(40px, -30px); }
      66.68% { transform: translate(40px, 55px); }
      83.35% { transform: translate(40px, 10px); }
      100% { transform: translate(0px, 15px); }
    }

    /* 文案区 */
    .message {
      text-align: center;
      z-index: 5;
      max-width: 480px;
    }
    .message h1 {
      font-size: 22px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: 0.02em;
    }
    .message h1 .accent {
      background: linear-gradient(135deg, #ff8787 0%, #fb87ff 50%, #87a7ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .message p {
      font-size: 14px;
      color: rgba(230, 232, 239, 0.6);
      line-height: 1.6;
    }

    /* 进度条 */
    .progress {
      width: 280px;
      height: 2px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
      z-index: 5;
    }
    .progress::before {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #ff8787, #fb87ff, #87a7ff, #75ba61);
      border-radius: 2px;
      animation: slide 1.8s ease-in-out infinite;
      box-shadow: 0 0 8px rgba(251, 135, 255, 0.5);
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    /* 底部操作 */
    .footer {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(230, 232, 239, 0.35);
      letter-spacing: 0.2em;
      text-align: center;
      z-index: 5;
    }
    .footer .id {
      font-family: 'Courier New', monospace;
      color: rgba(230, 232, 239, 0.5);
      margin-bottom: 4px;
    }

    @media (max-width: 480px) {
      .big-code { font-size: 160px; }
      .verify-container { width: 260px; height: 260px; }
      .ring { width: 220px; height: 220px; }
      .message h1 { font-size: 18px; }
    }
  </style>
</head>
<body>
<div class="status-bar">
  <div><span class="dot"></span>CHALLENGE · 468</div>
  <div class="code">ERR_HUMAN_CHECK</div>
</div>

<div class="verify-container">
  <div class="big-code">468</div>
  <div class="ring"></div>

  <div class="Strich1">
    <div class="Strich2">
      <div class="bubble"></div>
      <div class="bubble1"></div>
      <div class="bubble2"></div>
      <div class="bubble3"></div>
      <div class="bubble4"></div>
    </div>
  </div>
</div>

<div class="message">
  <h1>正在<span class="accent">验证</span>您是否为人类</h1>
  <p>系统检测到来自您网络的请求存在异常模式，请稍候。我们正在分析您的交互行为以完成安全验证。</p>
</div>

<div class="progress"></div>

<div class="footer">
  <div class="id">REQ_ID · 468-A1F7-9C3E-K2D8</div>
  <div>DO NOT CLOSE THIS WINDOW</div>
</div>
</body>
</html>
