<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Page Not Found</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&family=Montserrat:wght@700&display=swap" rel="stylesheet" />
  <style>
    /* Design Inspired by one of Stefan Devai's Design on Dribble */

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
    }

    html {
      background:
              radial-gradient(ellipse at 50% 40%, #2a2a2a 0%, #0d0d0d 70%, #000000 100%);
      background-color: #0d0d0d;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background:
              repeating-linear-gradient(
                      0deg,
                      rgba(255, 255, 255, 0.015) 0px,
                      rgba(255, 255, 255, 0.015) 1px,
                      transparent 1px,
                      transparent 3px
              );
    }

    /* 顶部状态栏 */
    .status-bar {
      position: absolute;
      top: 24px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: rgba(230, 232, 240, 0.45);
      letter-spacing: 0.15em;
      z-index: 10;
      font-family: 'Inter', sans-serif;
    }
    .status-bar .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #8b9eff;
      box-shadow: 0 0 8px #8b9eff;
      margin-right: 8px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .status-bar .code {
      font-family: 'JetBrains Mono', monospace;
      color: rgba(230, 232, 240, 0.6);
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* 文案区 */
    .page-message {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 5;
      max-width: 480px;
      font-family: 'Inter', sans-serif;
      width: 90%;
    }
    .page-message h1 {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: 0.01em;
    }
    .page-message h1 .accent {
      color: #8b9eff;
    }
    .page-message p {
      font-size: 12px;
      color: rgba(230, 232, 240, 0.55);
      line-height: 1.6;
    }
    .page-message .mono {
      font-family: 'JetBrains Mono', monospace;
      color: rgba(230, 232, 240, 0.4);
      font-size: 10px;
      margin-top: 6px;
    }

    /* 底部 */
    .page-footer {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(230, 232, 240, 0.35);
      letter-spacing: 0.2em;
      text-align: center;
      z-index: 5;
      font-family: 'Inter', sans-serif;
    }
    .page-footer .id {
      font-family: 'JetBrains Mono', monospace;
      color: rgba(230, 232, 240, 0.5);
      margin-bottom: 4px;
    }

    .main_wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30em;
      height: 30em;
    }

    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 5em;
      position: relative;
    }

    .antenna {
      width: 5em;
      height: 5em;
      border-radius: 50%;
      border: 2px solid black;
      background-color: #f27405;
      margin-bottom: -6em;
      margin-left: 0em;
      z-index: -1;
    }
    .antenna_shadow {
      position: absolute;
      background-color: transparent;
      width: 50px;
      height: 56px;
      margin-left: 1.68em;
      border-radius: 45%;
      transform: rotate(140deg);
      border: 4px solid transparent;
      box-shadow:
              inset 0px 16px #a85103,
              inset 0px 16px 1px 1px #a85103;
      -moz-box-shadow:
              inset 0px 16px #a85103,
              inset 0px 16px 1px 1px #a85103;
    }
    .antenna::after {
      content: "";
      position: absolute;
      margin-top: -9.4em;
      margin-left: 0.4em;
      transform: rotate(-25deg);
      width: 1em;
      height: 0.5em;
      border-radius: 50%;
      background-color: #f69e50;
    }
    .antenna::before {
      content: "";
      position: absolute;
      margin-top: 0.2em;
      margin-left: 1.25em;
      transform: rotate(-20deg);
      width: 1.5em;
      height: 0.8em;
      border-radius: 50%;
      background-color: #f69e50;
    }
    .a1 {
      position: relative;
      top: -102%;
      left: -130%;
      width: 12em;
      height: 5.5em;
      border-radius: 50px;
      background-image: linear-gradient(
              #171717,
              #171717,
              #353535,
              #353535,
              #171717
      );
      transform: rotate(-29deg);
      clip-path: polygon(50% 0%, 49% 100%, 52% 100%);
    }
    .a1d {
      position: relative;
      top: -211%;
      left: -35%;
      transform: rotate(45deg);
      width: 0.5em;
      height: 0.5em;
      border-radius: 50%;
      border: 2px solid black;
      background-color: #979797;
      z-index: 99;
    }
    .a2 {
      position: relative;
      top: -210%;
      left: -10%;
      width: 12em;
      height: 4em;
      border-radius: 50px;
      background-color: #171717;
      background-image: linear-gradient(
              #171717,
              #171717,
              #353535,
              #353535,
              #171717
      );
      margin-right: 5em;
      clip-path: polygon(
              47% 0,
              47% 0,
              34% 34%,
              54% 25%,
              32% 100%,
              29% 96%,
              49% 32%,
              30% 38%
      );
      transform: rotate(-8deg);
    }
    .a2d {
      position: relative;
      top: -294%;
      left: 94%;
      width: 0.5em;
      height: 0.5em;
      border-radius: 50%;
      border: 2px solid black;
      background-color: #979797;
      z-index: 99;
    }

    .notfound_text {
      background-color: black;
      padding-left: 0.3em;
      padding-right: 0.3em;
      font-size: 0.75em;
      color: white;
      letter-spacing: 0;
      border-radius: 5px;
      z-index: 10;
    }

    .tv {
      width: 17em;
      height: 9em;
      margin-top: 3em;
      border-radius: 15px;
      background-color: #d36604;
      display: flex;
      justify-content: center;
      border: 2px solid #1d0e01;
      box-shadow: inset 0.2em 0.2em #e69635;
    }
    .tv::after {
      content: "";
      position: absolute;
      width: 17em;
      height: 9em;
      border-radius: 15px;
      background:
              repeating-radial-gradient(#d36604 0 0.0001%, #00000070 0 0.0002%) 50% 0/2500px
              2500px,
              repeating-conic-gradient(#d36604 0 0.0001%, #00000070 0 0.0002%) 60% 60%/2500px
              2500px;
      background-blend-mode: difference;
      opacity: 0.09;
    }

    .curve_svg {
      position: absolute;
      margin-top: 0.25em;
      margin-left: -0.25em;
      height: 12px;
      width: 12px;
    }

    .display_div {
      display: flex;
      align-items: center;
      align-self: center;
      justify-content: center;
      border-radius: 15px;
      box-shadow: 3.5px 3.5px 0px #e69635;
    }
    .screen_out {
      width: auto;
      height: auto;
      border-radius: 10px;
    }
    .screen_out1 {
      width: 11em;
      height: 7.75em;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
    }
    .screen {
      width: 13em;
      height: 7.85em;
      font-family: Montserrat;
      border: 2px solid #1d0e01;
      background-color: #1a1a1a;
      background-image:
              radial-gradient(circle at 17% 23%, rgba(255,255,255,0.7) 0.5px, transparent 0.6px),
              radial-gradient(circle at 47% 71%, rgba(255,255,255,0.5) 0.5px, transparent 0.6px),
              radial-gradient(circle at 79% 38%, rgba(255,255,255,0.6) 0.5px, transparent 0.6px),
              radial-gradient(circle at 33% 89%, rgba(255,255,255,0.4) 0.5px, transparent 0.6px),
              radial-gradient(circle at 88% 62%, rgba(255,255,255,0.55) 0.5px, transparent 0.6px),
              radial-gradient(circle at 12% 56%, rgba(255,255,255,0.45) 0.5px, transparent 0.6px),
              radial-gradient(circle at 61% 14%, rgba(255,255,255,0.65) 0.5px, transparent 0.6px),
              radial-gradient(circle at 25% 47%, rgba(255,255,255,0.5) 0.5px, transparent 0.6px),
              radial-gradient(circle at 72% 82%, rgba(255,255,255,0.5) 0.5px, transparent 0.6px),
              radial-gradient(circle at 4% 78%, rgba(255,255,255,0.55) 0.5px, transparent 0.6px);
      background-size: 7px 7px, 11px 11px, 9px 9px, 13px 13px, 8px 8px, 12px 12px, 10px 10px, 14px 14px, 9px 9px, 11px 11px;
      background-position: 0 0, 2px 3px, 5px 1px, 1px 6px, 7px 4px, 3px 7px, 6px 2px, 0 5px, 8px 8px, 4px 0;
      animation: snow 0.15s steps(2) infinite;
      border-radius: 10px;
      z-index: 99;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #252525;
      letter-spacing: 0.15em;
      text-align: center;
      overflow: hidden;
    }

    /* 雪花叠加 - 横向扫描线 + 整体闪烁 */
    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
              repeating-linear-gradient(
                      0deg,
                      rgba(255, 255, 255, 0.04) 0px,
                      rgba(255, 255, 255, 0.04) 1px,
                      transparent 1px,
                      transparent 3px
              );
      pointer-events: none;
      z-index: 1;
    }
    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.05);
      animation: flicker 0.1s steps(3) infinite;
      pointer-events: none;
      z-index: 1;
    }

    .screenM {
      width: 13em;
      height: 7.85em;
      position: relative;
      font-family: Montserrat;
      background: linear-gradient(
              to right,
              #002fc6 0%,
              #002bb2 14.2857142857%,
              #3a3a3a 14.2857142857%,
              #303030 28.5714285714%,
              #ff0afe 28.5717142857%,
              #f500f4 42.8571428571%,
              #6c6c6c 42.8571428571%,
              #626262 57.1428571429%,
              #0affd9 57.1428571429%,
              #00f5ce 71.4285714286%,
              #3a3a3a 71.4285714286%,
              #303030 85.7142857143%,
              white 85.7142857143%,
              #fafafa 100%
      );
      border-radius: 10px;
      border: 2px solid black;
      z-index: 99;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #252525;
      letter-spacing: 0.15em;
      text-align: center;
      overflow: hidden;
    }
    .screenM:before,
    .screenM:after {
      content: "";
      position: absolute;
      left: 0;
      z-index: 1;
      width: 100%;
    }
    .screenM:before {
      top: 0;
      height: 68.4782608696%;
      background: linear-gradient(
              to right,
              white 0%,
              #fafafa 14.2857142857%,
              #ffe60a 14.2857142857%,
              #f5dc00 28.5714285714%,
              #0affd9 28.5714285714%,
              #00f5ce 42.8571428571%,
              #10ea00 42.8571428571%,
              #0ed600 57.1428571429%,
              #ff0afe 57.1428571429%,
              #f500f4 71.4285714286%,
              #ed0014 71.4285714286%,
              #d90012 85.7142857143%,
              #002fc6 85.7142857143%,
              #002bb2 100%
      );
    }
    .screenM:after {
      bottom: 0;
      height: 21.7391304348%;
      background: linear-gradient(
              to right,
              #006c6b 0%,
              #005857 16.6666666667%,
              white 16.6666666667%,
              #fafafa 33.3333333333%,
              #001b75 33.3333333333%,
              #001761 50%,
              #6c6c6c 50%,
              #626262 66.6666666667%,
              #929292 66.6666666667%,
              #888888 83.3333333333%,
              #3a3a3a 83.3333333333%,
              #303030 100%
      );
    }

    @keyframes b {
      100% {
        background-position:
                50% 0,
                60% 50%;
      }
    }

    /* 雪花噪点位置随机跳动 */
    @keyframes snow {
      0% {
        background-position:
                0 0, 2px 3px, 5px 1px, 1px 6px, 7px 4px,
                3px 7px, 6px 2px, 0 5px, 8px 8px, 4px 0;
      }
      20% {
        background-position:
                3px 1px, 0 4px, 7px 3px, 4px 0, 2px 6px,
                5px 2px, 1px 8px, 6px 4px, 3px 1px, 7px 5px;
      }
      40% {
        background-position:
                6px 2px, 4px 0, 2px 5px, 7px 1px, 0 7px,
                1px 4px, 8px 3px, 3px 6px, 5px 0, 2px 8px;
      }
      60% {
        background-position:
                1px 5px, 7px 2px, 3px 6px, 0 3px, 5px 0,
                8px 5px, 2px 1px, 4px 7px, 0 4px, 6px 2px;
      }
      80% {
        background-position:
                4px 6px, 1px 7px, 8px 4px, 6px 1px, 3px 5px,
                0 8px, 7px 0, 2px 3px, 5px 7px, 1px 2px;
      }
      100% {
        background-position:
                0 0, 2px 3px, 5px 1px, 1px 6px, 7px 4px,
                3px 7px, 6px 2px, 0 5px, 8px 8px, 4px 0;
      }
    }

    /* 整体闪烁模拟老电视信号不稳定 */
    @keyframes flicker {
      0%   { opacity: 0.02; }
      33%  { opacity: 0.08; }
      66%  { opacity: 0.04; }
      100% { opacity: 0.02; }
    }

    .lines {
      display: flex;
      column-gap: 0.1em;
      align-self: flex-end;
    }
    .line1,
    .line3 {
      width: 2px;
      height: 0.5em;
      background-color: black;
      border-radius: 25px 25px 0px 0px;
      margin-top: 0.5em;
    }
    .line2 {
      flex-grow: 1;
      width: 2px;
      height: 1em;
      background-color: black;
      border-radius: 25px 25px 0px 0px;
    }

    .buttons_div {
      width: 4.25em;
      align-self: center;
      height: 8em;
      background-color: #e69635;
      border: 2px solid #1d0e01;
      padding: 0.6em;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      row-gap: 0.75em;
      box-shadow: 3px 3px 0px #e69635;
    }
    .b1 {
      width: 1.65em;
      height: 1.65em;
      border-radius: 50%;
      background-color: #7f5934;
      border: 2px solid black;
      box-shadow:
              inset 2px 2px 1px #b49577,
              -2px 0px #513721,
              -2px 0px 0px 1px black;
    }
    .b1::before {
      content: "";
      position: absolute;
      margin-top: 1em;
      margin-left: 0.5em;
      transform: rotate(47deg);
      border-radius: 5px;
      width: 0.1em;
      height: 0.4em;
      background-color: #000000;
    }
    .b1::after {
      content: "";
      position: absolute;
      margin-top: 0.9em;
      margin-left: 0.8em;
      transform: rotate(47deg);
      border-radius: 5px;
      width: 0.1em;
      height: 0.55em;
      background-color: #000000;
    }
    .b1 div {
      content: "";
      position: absolute;
      margin-top: -0.1em;
      margin-left: 0.65em;
      transform: rotate(45deg);
      width: 0.15em;
      height: 1.5em;
      background-color: #000000;
    }
    .b2 {
      width: 1.65em;
      height: 1.65em;
      border-radius: 50%;
      background-color: #7f5934;
      border: 2px solid black;
      box-shadow:
              inset 2px 2px 1px #b49577,
              -2px 0px #513721,
              -2px 0px 0px 1px black;
    }
    .b2::before {
      content: "";
      position: absolute;
      margin-top: 1.05em;
      margin-left: 0.8em;
      transform: rotate(-45deg);
      border-radius: 5px;
      width: 0.15em;
      height: 0.4em;
      background-color: #000000;
    }
    .b2::after {
      content: "";
      position: absolute;
      margin-top: -0.1em;
      margin-left: 0.65em;
      transform: rotate(-45deg);
      width: 0.15em;
      height: 1.5em;
      background-color: #000000;
    }
    .speakers {
      display: flex;
      flex-direction: column;
      row-gap: 0.5em;
    }
    .speakers .g1 {
      display: flex;
      column-gap: 0.25em;
    }
    .speakers .g1 .g11,
    .g12,
    .g13 {
      width: 0.65em;
      height: 0.65em;
      border-radius: 50%;
      background-color: #7f5934;
      border: 2px solid black;
      box-shadow: inset 1.25px 1.25px 1px #b49577;
    }
    .speakers .g {
      width: auto;
      height: 2px;
      background-color: #171717;
    }

    .bottom {
      width: 100%;
      height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      column-gap: 8.7em;
    }
    .base1 {
      height: 1em;
      width: 2em;
      border: 2px solid #171717;
      background-color: #4d4d4d;
      margin-top: -0.15em;
      z-index: -1;
    }
    .base2 {
      height: 1em;
      width: 2em;
      border: 2px solid #171717;
      background-color: #4d4d4d;
      margin-top: -0.15em;
      z-index: -1;
    }
    .base3 {
      position: absolute;
      height: 0.15em;
      width: 17.5em;
      background-color: #171717;
      margin-top: 0.8em;
    }

    .text_404 {
      position: absolute;
      display: flex;
      flex-direction: row;
      column-gap: 6em;
      z-index: -5;
      margin-bottom: 2em;
      align-items: center;
      justify-content: center;
      opacity: 0.5;
      font-family: Montserrat;
    }
    .text_4041 {
      transform: scaleY(24.5) scaleX(9);
    }
    .text_4042 {
      transform: scaleY(24.5) scaleX(9);
    }
    .text_4043 {
      transform: scaleY(24.5) scaleX(9);
    }

    @media only screen and (max-width: 495px) {
      .text_404 {
        column-gap: 6em;
      }
    }
    @media only screen and (max-width: 395px) {
      .text_404 {
        column-gap: 4em;
      }
      .text_4041 {
        transform: scaleY(25) scaleX(8);
      }
      .text_4042 {
        transform: scaleY(25) scaleX(8);
      }
      .text_4043 {
        transform: scaleY(25) scaleX(8);
      }
    }

    @media (max-width: 275px), (max-height: 520px) {
      .main {
        position: relative;
      }
    }

    @media only screen and (max-width: 1024px) {
      .screenM {
        display: flex;
      }
      .screen {
        display: none;
      }
    }
    @media only screen and (min-width: 1025px) {
      .screen {
        display: flex;
      }
      .screenM {
        display: none;
      }
    }
  </style>
</head>
<body>
<div class="status-bar">
  <div><span class="dot"></span>ROUTE · UNREACHABLE</div>
  <div class="code">404 PAGE NOT FOUND</div>
</div>

<div class="page-message">
  <h1>页面<span class="accent">不存在</span></h1>
  <p>您访问的页面已被移除、重命名或暂时不可用。</p>
  <div class="mono">[web-server/1.0 · 404 · PAGE_NOT_FOUND · route=null]</div>
</div>

<div class="main_wrapper">
  <div class="main">
    <div class="antenna">
      <div class="antenna_shadow"></div>
      <div class="a1"></div>
      <div class="a1d"></div>
      <div class="a2"></div>
      <div class="a2d"></div>
      <div class="a_base"></div>
    </div>
    <div class="tv">
      <div class="cruve">
        <svg
                class="curve_svg"
                version="1.1"
                xmlns="http://www.w3.org/2000/svg"
                xmlns:xlink="http://www.w3.org/1999/xlink"
                viewBox="0 0 189.929 189.929"
                xml:space="preserve"
        >
            <path
                    d="M70.343,70.343c-30.554,30.553-44.806,72.7-39.102,115.635l-29.738,3.951C-5.442,137.659,11.917,86.34,49.129,49.13
        C86.34,11.918,137.664-5.445,189.928,1.502l-3.95,29.738C143.041,25.54,100.895,39.789,70.343,70.343z"
            ></path>
          </svg>
      </div>
      <div class="display_div">
        <div class="screen_out">
          <div class="screen_out1">
            <div class="screen">
              <span class="notfound_text">NOT FOUND</span>
            </div>
            <div class="screenM">
              <span class="notfound_text">NOT FOUND</span>
            </div>
          </div>
        </div>
      </div>
      <div class="lines">
        <div class="line1"></div>
        <div class="line2"></div>
        <div class="line3"></div>
